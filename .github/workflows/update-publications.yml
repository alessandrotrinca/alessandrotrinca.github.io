name: Sync publications from ADS

# Runs every Monday at 06:00 UTC, and on demand from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch from ADS
        env:
          ADS_TOKEN: ${{ secrets.ADS_TOKEN }}
        run: python tools/update_publications.py

      - name: Commit if anything changed
        run: |
          if [[ -n "$(git status --porcelain data/publications.js)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/publications.js
            git commit -m "Sync publications from ADS"
            git push
          else
            echo "No change."
          fi
